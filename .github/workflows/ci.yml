name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate addon structure
        run: python scripts/validate_addon.py

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Check Lua syntax
        shell: bash
        run: |
          LUA_COMPILER="$(command -v luac5.1 || command -v luac)"
          find AddOns/PallandoDataCollector -name '*.lua' -print0 |
            xargs -0 -n1 "$LUA_COMPILER" -p
